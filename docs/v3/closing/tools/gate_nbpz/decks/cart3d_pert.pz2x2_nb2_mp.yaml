boundary-condition:
  external:
    x1-inner: reflecting
    x1-outer: reflecting
    x2-inner: periodic
    x2-outer: periodic
    x3-inner: periodic
    x3-outer: periodic
distribute:
  blocks_per_process: 2
  layout: cubed
  nb1: 2
  nb2: 2
  nb3: 1
dynamics:
  anomaly: true
  equation-of-state:
    density-floor: 1.0e-10
    limiter: false
    pressure-floor: 1.0e-10
    type: ideal-moist
  perturbation-flux: true
  precision: float64
  reconstruct:
    horizontal:
      scale: false
      shock: false
      type: weno5
    vertical:
      scale: false
      shock: false
      type: weno5
  riemann-solver:
    type: hllc
forcing:
  const-gravity:
    grav1: -10.0
geometry:
  bounds:
    x1max: 10000.0
    x1min: 0.0
    x2max: 10000.0
    x2min: 0.0
    x3max: 5000.0
    x3min: 0.0
  cells:
    nghost: 3
    nx1: 24
    nx2: 8
    nx3: 4
  type: cartesian
integration:
  cfl: 0.4
  implicit-scheme: 0
  nlim: -1
  tlim: 1000000000.0
  type: rk3
reactions:
- equation: vapor <=> cloud
  rate-constant:
    formula: h2o_ideal
  type: nucleation
reference-state:
  Pref: 100000.0
  Tref: 0.0
scalar:
  names:
  - trace
  nvar: 1
  reconstruct:
    type: weno5
species:
- composition:
    H: 1.6667
    He: 0.16667
  cv_R: 2.5
  name: dry
- composition:
    H: 2
    O: 1
  cv_R: 2.5
  name: vapor
  u0_R: 0.0
- composition:
    H: 2
    O: 1
  cv_R: 9.0
  name: cloud
  u0_R: -3430.0
